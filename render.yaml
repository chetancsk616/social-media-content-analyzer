services:
  - type: web
    name: social-media-content-analyzer-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: "*"
      - key: MAX_FILE_SIZE_MB
        value: "10"
